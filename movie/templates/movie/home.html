
{% extends 'base.html' %}
{% block content %}
<div class="row row-cols-1 row-cols-md-3 g-4">
{% for movie in movies %}
<div class="col">
<div class="card h-100">
{% if movie.image %}
<img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}" style="height: 200px; object-fit: cover;">
{% endif %}
<div class="card-body">
<h5>{{ movie.title }}</h5>
<p>{{ movie.description }}</p>
<p><b>Genre:</b> {{ movie.genre }}</p>
<p><b>Year:</b> {{ movie.year }}</p>
</div></div></div>
{% endfor %}
</div>
<form action="{% url 'signup' %}" method="get" class="mt-4">
<input type="email" name="email" required>
<button class="btn btn-primary">Sign Up</button>
</form>
{% endblock %}
